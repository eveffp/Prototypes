<head>

  <title>IMDb Movie Slots — Tonight's Pick</title>
  <style>
    :root {
      --imdb-gold: #f5c518;
      --imdb-gold-dark: #d4a713;
      --bg-base: #0e0e0e;
      --bg-surface: #181818;
      --bg-card: #212121;
      --border: #323232;
      --text: #ffffff;
      --text-dim: #9e9e9e;
      --link: #5799ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-badge {
      background-color: var(--imdb-gold);
      color: #000;
      font-weight: 900;
      font-size: 24px;
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: -1px;
    }

    .brand-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-sub {
      color: var(--imdb-gold);
      font-weight: 800;
    }

    .tagline {
      font-size: 13px;
      color: var(--text-dim);
    }

    .app-container {
      max-width: 920px;
      width: 100%;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .slot-settings {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-item label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    select {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      padding: 11px 12px;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--imdb-gold);
    }

    .slot-machine-box {
      width: 100%;
      background: radial-gradient(circle at center, #262626 0%, #161616 100%);
      border: 2px solid var(--imdb-gold);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(245, 197, 24, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    .slot-viewport {
      width: 100%;
      min-height: 380px;
      background-color: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .slot-spinning-banner {
      font-size: 26px;
      font-weight: 800;
      color: var(--imdb-gold);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: none;
      animation: pulse 0.15s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.7; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .slot-idle-text {
      color: var(--text-dim);
      font-size: 16px;
      text-align: center;
    }

    .result-card {
      display: none;
      width: 100%;
      grid-template-columns: 240px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media(max-width: 680px) {
      .result-card {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }
    }

    .poster-box {
      width: 240px;
      height: 340px;
      background-color: var(--bg-card);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      flex-shrink: 0;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 8px;
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #252525 0%, #151515 100%);
    }

    .movie-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .movie-meta-badge {
      color: var(--imdb-gold);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .movie-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
    }

    .movie-submeta {
      color: var(--text-dim);
      font-size: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .rating-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .star-gold {
      color: var(--imdb-gold);
      font-size: 24px;
    }

    .rating-val {
      font-size: 24px;
      font-weight: 800;
    }

    .rating-max {
      color: var(--text-dim);
      font-size: 14px;
    }

    .rating-votes {
      color: var(--text-dim);
      font-size: 13px;
      margin-left: 8px;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0;
    }

    .genre-tag {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: #ddd;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 14px;
    }

    .vibe-tag {
      background-color: rgba(245, 197, 24, 0.15);
      border: 1px solid var(--imdb-gold);
      color: var(--imdb-gold);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 14px;
      font-weight: 600;
    }

    .btn-imdb-page {
      margin-top: 16px;
      align-self: flex-start;
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--link);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .btn-imdb-page:hover {
      background-color: rgba(87, 153, 239, 0.18);
    }

    .btn-spin {
      background: linear-gradient(180deg, var(--imdb-gold) 0%, var(--imdb-gold-dark) 100%);
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 16px 56px;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 197, 24, 0.4);
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-spin:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(245, 197, 24, 0.6);
    }

    .btn-spin:active {
      transform: translateY(2px);
    }

    .btn-spin:disabled {
      background: #555;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>

      { tconst: "tt0096283", primaryTitle: "My Neighbor Totoro", startYear: 1988, runtimeMinutes: 86, genres: ["Animation", "Comedy", "Family"], averageRating: 8.1, numVotes: 390000 },
      { tconst: "tt0112471", primaryTitle: "Before Sunrise", startYear: 1995, runtimeMinutes: 101, genres: ["Drama", "Romance"], averageRating: 8.1, numVotes: 340000 },
      { tconst: "tt0371724", primaryTitle: "The Hitchhiker's Guide to the Galaxy", startYear: 2005, runtimeMinutes: 109, genres: ["Adventure", "Comedy", "Sci-Fi"], averageRating: 6.7, numVotes: 210000 },
      { tconst: "tt0107977", primaryTitle: "Groundhog Day", startYear: 1993, runtimeMinutes: 101, genres: ["Comedy", "Fantasy", "Romance"], averageRating: 8.0, numVotes: 680000 },
      { tconst: "tt0119217", primaryTitle: "Good Will Hunting", startYear: 1997, runtimeMinutes: 126, genres: ["Drama", "Romance"], averageRating: 8.3, numVotes: 1100000 },
      { tconst: "tt0071562", primaryTitle: "The Godfather Part II", startYear: 1974, runtimeMinutes: 202, genres: ["Crime", "Drama"], averageRating: 9.0, numVotes: 1400000 }
    ];

    // UI elements
    const moodSelect = document.getElementById("moodSelect");
    const timeSelect = document.getElementById("timeSelect");
    const vibeSelect = document.getElementById("vibeSelect");

    const spinBtn = document.getElementById("spinBtn");
    const idleText = document.getElementById("idleText");
    const spinningBanner = document.getElementById("spinningBanner");
    const resultCard = document.getElementById("resultCard");

    const posterBox = document.getElementById("posterBox");
    const mBadge = document.getElementById("mBadge");
    const mTitle = document.getElementById("mTitle");
    const mYear = document.getElementById("mYear");
    const mRuntime = document.getElementById("mRuntime");
    const mRating = document.getElementById("mRating");
    const mVotes = document.getElementById("mVotes");
    const mTags = document.getElementById("mTags");
    const mImdbLink = document.getElementById("mImdbLink");

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
      if (num >= 1000) return (num / 1000).toFixed(0) + "K";
      return num;
    }

    // Filter matching logic
    function matchesMood(genres, mood) {
      if (mood === "ALL") return true;
      if (mood === "adrenaline") return genres.includes("Action") || genres.includes("Thriller");
      if (mood === "mindbending") return genres.includes("Sci-Fi") || genres.includes("Mystery");
      if (mood === "datenight") return genres.includes("Comedy") || genres.includes("Romance");
      if (mood === "nightmares") return genres.includes("Horror") || genres.includes("Mystery");
      if (mood === "feelgood") return genres.includes("Animation") || genres.includes("Family") || genres.includes("Adventure");
      if (mood === "crime") return genres.includes("Crime") || genres.includes("Drama");
      return true;
    }

    function matchesTime(runtime, time) {
      if (time === "ALL") return true;
      if (time === "quick") return runtime < 100;
      if (time === "standard") return runtime >= 100 && runtime <= 135;
      if (time === "epic") return runtime > 135 && runtime <= 165;
      if (time === "marathon") return runtime > 165;
      return true;
    }

    function matchesVibe(rating, votes, vibe) {
      if (vibe === "ALL") return true;
      if (vibe === "gem") return rating >= 7.6 && votes <= 700000;
      if (vibe === "blockbuster") return rating >= 8.5 && votes >= 800000;
      if (vibe === "popcorn") return rating >= 6.5 && rating <= 8.3;
      return true;
    }

    function getFilteredPool() {
      const mood = moodSelect.value;
      const time = timeSelect.value;
      const vibe = vibeSelect.value;

      return MOVIES_DB.filter(m =>
        matchesMood(m.genres, mood) &&
        matchesTime(m.runtimeMinutes, time) &&
        matchesVibe(m.averageRating, m.numVotes, vibe)
      );
    }

    function getVibeBadge(m) {
      if (m.averageRating >= 7.6 && m.numVotes <= 700000) return "💎 Hidden Gem";
      if (m.averageRating >= 8.5 && m.numVotes >= 800000) return "🏆 All-Time Classic";
      return "🍿 Popcorn Pick";
    }

    function loadPoster(tconst, title) {
      posterBox.innerHTML = "";
      const img = new Image();
      img.src = `https://images.metahub.space/poster/medium/${tconst}/img`;
      img.alt = title;

      img.onload = () => {
        posterBox.appendChild(img);
      };

      img.onerror = () => {
        posterBox.innerHTML = `
          <div class="poster-fallback">
            <span style="font-size: 40px; color: var(--imdb-gold);">🎬</span>
            <span style="font-size: 13px; font-weight: 600; padding: 0 10px; text-align: center;">${title}</span>
          </div>
        `;
      };
    }

    function displayMovie(m, isFallback = false) {
      loadPoster(m.tconst, m.primaryTitle);

      if (isFallback) {
        mBadge.textContent = "Closest Match (No exact match for all 3 criteria)";
        mBadge.style.color = "#ffa726";
      } else {
        mBadge.textContent = "Tonight's Slot Pick";
        mBadge.style.color = "var(--imdb-gold)";
      }

      mTitle.textContent = m.primaryTitle;
      mYear.textContent = m.startYear;
      mRuntime.textContent = `${m.runtimeMinutes} min`;
      mRating.textContent = m.averageRating.toFixed(1);
      mVotes.textContent = `(${formatNumber(m.numVotes)} votes)`;

      const vibeLabel = getVibeBadge(m);
      const genreTags = m.genres.map(g => `<span class="genre-tag">${g}</span>`).join("");
      const vibeTag = `<span class="vibe-tag">${vibeLabel}</span>`;

      mTags.innerHTML = `${vibeTag} ${genreTags}`;
      mImdbLink.href = `https://www.imdb.com/title/${m.tconst}/`;
    }

    // Spin mechanism with intelligent fallback
    spinBtn.addEventListener("click", () => {
      let pool = getFilteredPool();
      let isFallback = false;

      // Fallback 1: Keep mood and time, relax vibe
      if (pool.length === 0) {
        const mood = moodSelect.value;
        const time = timeSelect.value;
        pool = MOVIES_DB.filter(m => matchesMood(m.genres, mood) && matchesTime(m.runtimeMinutes, time));
        isFallback = true;
      }

      // Fallback 2: Keep only mood
      if (pool.length === 0) {
        const mood = moodSelect.value;
        pool = MOVIES_DB.filter(m => matchesMood(m.genres, mood));
        isFallback = true;
      }

      // Fallback 3: Safety net - full catalog
      if (pool.length === 0) {
        pool = MOVIES_DB;
        isFallback = true;
      }

      spinBtn.disabled = true;
      idleText.style.display = "none";
      resultCard.style.display = "none";
      spinningBanner.style.display = "block";

      let counter = 0;
      const interval = setInterval(() => {
        const randomTemp = pool[Math.floor(Math.random() * pool.length)];
        spinningBanner.textContent = `🎲 ${randomTemp.primaryTitle.toUpperCase()}...`;
        counter++;

        if (counter > 12) {
          clearInterval(interval);
          const finalChoice = pool[Math.floor(Math.random() * pool.length)];

          spinningBanner.style.display = "none";
          displayMovie(finalChoice, isFallback);
          resultCard.style.display = "grid";
          spinBtn.disabled = false;
        }
      }, 80);
    });
  </script>
</body>
</html>
